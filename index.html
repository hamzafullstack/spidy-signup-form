<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Container">
        <div class="left-side">
            <img class="main-image" src="assets/hector-reyes-unsplash.jpg" alt="spiderman image">
            <img class="logo" src="assets/spdman.svg" alt="logo" width="50px">
            <span>Spidy</span>
            </div>
        </div>
        <div class="right-side">
            <p>With great power comes great responsibility. join our Spider-Man fan club and swing into action with fellow heroes today!</p>
            <p>You know you want to.</p>
            <div class="middle">let's do it</div>
            <form action="">
                <label for="first-name">First Name *:</label>
                <input type="text" name="fname" id="first-name" required>
                <label for="last-name">Last Name *:</label>
                <input type="text" name="lname" id="last-name" required>
                <label for="email">Email *:</label>
                <input type="email" name="email" id="email" required>
                <label for="phone">Phone Number *:</label>
                <input type="tel" name="phone" id="phone" required>
                <label for="pwd">Password *:</label>
                <input type="password" name="password" id="pwd" required>
                <label for="confirm-pwd">Confirm Password *:</label>
                <input type="password" name="confirm-password" id="confirm-pwd" required>

                <button type="submit">CREATE AN ACCOUNT</button>
                <p>Already have an account?</p>
                <span><a href="#">Log in</a></span>
            </form>
        </div>
        </div>

    </div>
</body>
</html>
